<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="uv. searching and representing [raw version]">
    <meta property="og:title" content="uv">
    <meta property="og:description" content="uv. searching and representing [raw version]">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://uvuv.eu/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="uv">
    <meta name="twitter:description" content="uv. searching and representing [raw version]">
    <title>uv</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      html {
        scroll-snap-type: y mandatory;
      }

      body {
        position: relative;
        min-height: 200vh;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #000;
        pointer-events: none;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.2s linear, visibility 0s linear 0.2s;
      }

      body.revealed::before {
        opacity: 0;
        visibility: hidden;
      }

      .backgrounds {
        position: absolute;
        inset: 0 0 auto;
        height: 100vh;
        overflow: hidden;
        background: #000;
        scroll-snap-align: start;
        z-index: 0;
      }

      .backgrounds img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: auto;
        min-height: 100vh;
        object-fit: cover;
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
        transform-origin: center;
        animation: cycle 12s linear infinite;
        animation-play-state: running;
        will-change: transform, opacity;
      }

      body:not(.revealed) .backgrounds img { animation-play-state: paused; }

      .backgrounds img:nth-child(1) { animation-delay: 0s; }
      .backgrounds img:nth-child(2) { animation-delay: 1.5s; }
      .backgrounds img:nth-child(3) { animation-delay: 3s; }
      .backgrounds img:nth-child(4) { animation-delay: 4.5s; }
      .backgrounds img:nth-child(5) { animation-delay: 6s; }
      .backgrounds img:nth-child(6) { animation-delay: 7.5s; }
      .backgrounds img:nth-child(7) { animation-delay: 9s; }
      .backgrounds img:nth-child(8) { animation-delay: 10.5s; }

      @keyframes cycle {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        12.6% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        12.61%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
      }

      .identity {
        position: fixed;
        top: 40px;
        left: 25vw;
        z-index: 3;
        display: block;
        width: 25vw;
        height: auto;
        margin: 0;
        filter: invert(1);
        mix-blend-mode: difference;
        transition: filter 180ms ease;
        cursor: pointer;
      }

      .identity:hover {
        filter: invert(1) blur(2px);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .secondary-screen {
        position: absolute;
        top: 100vh;
        left: 0;
        width: 100%;
        height: 100vh;
        background: #fff;
        scroll-snap-align: start;
        z-index: 2;
      }

      .contact {
        position: absolute;
        left: 25vw;
        bottom: 40px;
        width: 25vw;
        height: auto;
        opacity: 0;
        transition: opacity 0.2s linear;
        pointer-events: none;
      }

      body.at-bottom .contact {
        opacity: 1;
        pointer-events: auto;
      }

      .contact-image {
        display: block;
        width: 100%;
        height: auto;
      }

      .contact-link {
        position: absolute;
        left: 0;
        width: 100%;
        display: block;
        background: rgba(255, 255, 255, 0.001);
        -webkit-backdrop-filter: blur(0);
        backdrop-filter: blur(0);
        transition: -webkit-backdrop-filter 180ms ease, backdrop-filter 180ms ease;
        outline: none;
      }

      .contact-link:hover,
      .contact-link:focus-visible,
      .contact-link:active {
        -webkit-backdrop-filter: blur(0.8px);
        backdrop-filter: blur(0.8px);
      }

      .contact-instagram {
        top: 2.42%;
        left: 8.67%;
        width: 50.94%;
        height: 37.54%;
      }

      .contact-email {
        top: 39.95%;
        left: 8.76%;
        width: 91.12%;
        height: 59.94%;
      }

      @media (prefers-reduced-motion: reduce) {
        .backgrounds img { animation: none; }
        .backgrounds img:first-child { opacity: 1; }
        .identity { transition: none; }
      }

      @media (max-width: 767px) {
        html,
        body {
          min-height: calc(100svh + 100lvh);
          overflow-x: hidden;
          overflow-y: auto;
          overscroll-behavior: none;
          touch-action: pan-y;
        }

        .backgrounds {
          position: absolute;
          inset: 0 0 auto;
          height: 100svh;
          scroll-snap-align: start;
        }

        .backgrounds img {
          width: auto;
          height: 100svh;
          min-height: 0;
          max-width: none;
          object-fit: fill;
          animation: none;
          opacity: 0;
          transform: translate(-50%, -50%) scale(1);
        }

        .backgrounds img.mobile-current {
          opacity: 1;
          animation: mobile-zoom 1.5s linear forwards;
        }

        .identity {
          position: fixed;
          top: 20px;
          left: 12.5vw;
          width: 50vw;
          margin: 0;
          filter: invert(1) blur(var(--mobile-blur, 0px));
          transition: none;
          cursor: default;
        }

        .identity:hover {
          filter: invert(1) blur(var(--mobile-blur, 0px));
        }

        .secondary-screen {
          top: 100svh;
          height: 100lvh;
        }

        .contact {
          left: 12.5vw;
          bottom: 20px;
          width: 50vw;
        }
      }

      @keyframes mobile-zoom {
        from { transform: translate(-50%, -50%) scale(1); }
        to { transform: translate(-50%, -50%) scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div class="backgrounds" aria-hidden="true">
      <img src="assets/background-01.webp" alt="" fetchpriority="high">
      <img src="assets/background-02.webp" alt="" loading="eager">
      <img src="assets/background-03.webp" alt="" loading="eager">
      <img src="assets/background-04.webp" alt="" loading="eager">
      <img src="assets/background-05.webp" alt="" loading="eager">
      <img src="assets/background-06.webp" alt="" loading="eager">
      <img src="assets/background-07.webp" alt="" loading="eager">
      <img src="assets/background-08.webp" alt="" loading="eager">
    </div>

    <header>
      <h1 class="visually-hidden">uv</h1>
      <img class="identity" src="assets/uvuv-logo-description.png" alt="uv. searching and representing [raw version]" role="button" tabindex="0" aria-label="Apri la seconda schermata">
    </header>
    <section class="secondary-screen" aria-label="Seconda schermata">
      <div class="contact">
        <img class="contact-image" src="assets/contact.png" alt="Contatti UV">
        <a class="contact-link contact-instagram" href="https://www.instagram.com/uv.uv.uv.uv.uv.uv/" target="_blank" rel="noopener noreferrer" aria-label="Profilo Instagram uv.uv.uv.uv.uv.uv"></a>
        <a class="contact-link contact-email" href="mailto:uslenghivrenozaj@gmail.com" aria-label="Invia un’email a uslenghivrenozaj@gmail.com"></a>
      </div>
    </section>
    <script>
      const backgrounds = [...document.querySelectorAll(".backgrounds img")];
      const minimumBlackDuration = new Promise((resolve) => window.setTimeout(resolve, 500));

      function waitForImage(image) {
        const decodeImage = () => {
          if (typeof image.decode !== "function") return Promise.resolve();
          return image.decode().catch(() => undefined);
        };

        if (image.complete) return decodeImage();

        return new Promise((resolve) => {
          image.addEventListener("load", () => decodeImage().then(resolve), { once: true });
          image.addEventListener("error", resolve, { once: true });
        });
      }

      Promise.all([
        minimumBlackDuration,
        ...backgrounds.map(waitForImage)
      ]).then(() => {
        if (window.matchMedia("(max-width: 767px)").matches) {
          startMobileSlideshow();
        } else {
          window.requestAnimationFrame(() => document.body.classList.add("revealed"));
        }
      });

      const mobileQuery = window.matchMedia("(max-width: 767px)");
      const identity = document.querySelector(".identity");
      const secondaryScreen = document.querySelector(".secondary-screen");
      let blurFrame;
      let mobileSlideIndex = 0;
      let mobileCurrentSlide;
      let mobileLayer = 1;

      function presentMobileSlide(index, firstSlide = false) {
        const nextSlide = backgrounds[index];

        waitForImage(nextSlide).then(() => {
          nextSlide.classList.remove("mobile-current");
          nextSlide.style.zIndex = String(++mobileLayer);
          nextSlide.style.opacity = "1";
          nextSlide.style.transform = "translate(-50%, -50%) scale(1)";

          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(() => {
              const previousSlide = mobileCurrentSlide;
              nextSlide.classList.add("mobile-current");
              mobileCurrentSlide = nextSlide;

              if (previousSlide && previousSlide !== nextSlide) {
                previousSlide.classList.remove("mobile-current");
                previousSlide.style.opacity = "0";
              }

              if (firstSlide) document.body.classList.add("revealed");

              window.setTimeout(() => {
                mobileSlideIndex = (mobileSlideIndex + 1) % backgrounds.length;
                presentMobileSlide(mobileSlideIndex);
              }, 1500);
            });
          });
        });
      }

      function startMobileSlideshow() {
        mobileSlideIndex = 0;
        presentMobileSlide(mobileSlideIndex, true);
      }

      function openSecondaryScreen() {
        if (mobileQuery.matches) return;
        secondaryScreen.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function updateIdentityInteraction() {
        if (mobileQuery.matches) {
          identity.removeAttribute("role");
          identity.removeAttribute("tabindex");
          identity.removeAttribute("aria-label");
        } else {
          identity.setAttribute("role", "button");
          identity.setAttribute("tabindex", "0");
          identity.setAttribute("aria-label", "Apri la seconda schermata");
        }
      }

      function updateBottomState() {
        const maximumScroll = document.documentElement.scrollHeight - window.innerHeight;
        document.body.classList.toggle("at-bottom", window.scrollY >= maximumScroll - 1);
      }

      identity.addEventListener("click", openSecondaryScreen);
      identity.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openSecondaryScreen();
        }
      });

      mobileQuery.addEventListener("change", updateIdentityInteraction);
      updateIdentityInteraction();

      window.addEventListener("scroll", updateBottomState, { passive: true });
      window.addEventListener("resize", updateBottomState);
      mobileQuery.addEventListener("change", updateBottomState);
      updateBottomState();

      function updateMobileBlur() {
        blurFrame = undefined;
        if (!mobileQuery.matches) {
          identity.style.removeProperty("--mobile-blur");
          return;
        }

        const slideHeight = secondaryScreen.offsetTop;
        const progress = slideHeight > 0
          ? Math.min(Math.max(window.scrollY / slideHeight, 0), 1)
          : 0;
        const blurProgress = 1 - Math.abs(progress * 2 - 1);
        identity.style.setProperty("--mobile-blur", `${blurProgress * 2}px`);
      }

      function requestMobileBlurUpdate() {
        if (!blurFrame) blurFrame = window.requestAnimationFrame(updateMobileBlur);
      }

      window.addEventListener("resize", requestMobileBlurUpdate);
      mobileQuery.addEventListener("change", requestMobileBlurUpdate);
      window.addEventListener("scroll", requestMobileBlurUpdate, { passive: true });
      updateMobileBlur();
    </script>
  </body>
</html>
