<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="UVUV — architecture, landscape, research, activism.">
    <title>uv</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #000;
        pointer-events: none;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.2s linear, visibility 0s linear 0.2s;
      }

      body.revealed::before {
        opacity: 0;
        visibility: hidden;
      }

      .backgrounds {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      .backgrounds img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: auto;
        min-height: 100vh;
        object-fit: cover;
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
        transform-origin: center;
        animation: cycle 12s linear infinite;
        animation-play-state: running;
        will-change: transform, opacity;
      }

      body:not(.revealed) .backgrounds img { animation-play-state: paused; }

      .backgrounds img:nth-child(1) { animation-delay: 0s; }
      .backgrounds img:nth-child(2) { animation-delay: 1.5s; }
      .backgrounds img:nth-child(3) { animation-delay: 3s; }
      .backgrounds img:nth-child(4) { animation-delay: 4.5s; }
      .backgrounds img:nth-child(5) { animation-delay: 6s; }
      .backgrounds img:nth-child(6) { animation-delay: 7.5s; }
      .backgrounds img:nth-child(7) { animation-delay: 9s; }
      .backgrounds img:nth-child(8) { animation-delay: 10.5s; }

      @keyframes cycle {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        12.6% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        12.61%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
      }

      .identity {
        position: relative;
        z-index: 1;
        display: block;
        width: 25vw;
        height: auto;
        margin: 40px 0 0 25vw;
        filter: invert(1);
        mix-blend-mode: difference;
        transition: filter 180ms ease;
      }

      .identity:hover {
        filter: invert(1) blur(2px);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .backgrounds img { animation: none; }
        .backgrounds img:first-child { opacity: 1; }
        .identity { transition: none; }
      }

      @media (max-width: 767px) {
        html,
        body {
          height: 100dvh;
          min-height: 100dvh;
          overflow: hidden;
          overscroll-behavior: none;
          touch-action: none;
        }

        .backgrounds {
          position: fixed;
          inset: 0;
          height: 100dvh;
        }

        .backgrounds img {
          width: auto;
          height: 100dvh;
          min-height: 0;
          max-width: none;
          object-fit: fill;
        }

        .identity {
          position: fixed;
          top: 20px;
          left: 12.5vw;
          width: 50vw;
          margin: 0;
          filter: invert(1) blur(var(--mobile-blur, 0px));
          transition: none;
        }

        .identity:hover {
          filter: invert(1) blur(var(--mobile-blur, 0px));
        }
      }
    </style>
  </head>
  <body>
    <div class="backgrounds" aria-hidden="true">
      <img src="assets/background-01.webp" alt="" fetchpriority="high">
      <img src="assets/background-02.webp" alt="" loading="eager">
      <img src="assets/background-03.webp" alt="" loading="eager">
      <img src="assets/background-04.webp" alt="" loading="eager">
      <img src="assets/background-05.webp" alt="" loading="eager">
      <img src="assets/background-06.webp" alt="" loading="eager">
      <img src="assets/background-07.webp" alt="" loading="eager">
      <img src="assets/background-08.webp" alt="" loading="eager">
    </div>

    <header>
      <h1 class="visually-hidden">uv</h1>
      <img class="identity" src="assets/uvuv-logo-description.png" alt="UVUV — architecture, landscape, research, activism">
    </header>
    <script>
      window.setTimeout(() => document.body.classList.add("revealed"), 500);

      const mobileQuery = window.matchMedia("(max-width: 767px)");
      const identity = document.querySelector(".identity");
      let blurFrame;
      let mobileBlurProgress = 0;
      let previousTouchY;

      function updateMobileBlur() {
        blurFrame = undefined;
        if (!mobileQuery.matches) {
          identity.style.removeProperty("--mobile-blur");
          return;
        }

        identity.style.setProperty("--mobile-blur", `${mobileBlurProgress * 2}px`);
      }

      function requestMobileBlurUpdate() {
        if (!blurFrame) blurFrame = window.requestAnimationFrame(updateMobileBlur);
      }

      window.addEventListener("resize", requestMobileBlurUpdate);
      mobileQuery.addEventListener("change", requestMobileBlurUpdate);

      window.addEventListener("touchstart", (event) => {
        previousTouchY = event.touches[0].clientY;
      }, { passive: true });

      window.addEventListener("touchmove", (event) => {
        if (!mobileQuery.matches || previousTouchY === undefined) return;
        event.preventDefault();
        const currentTouchY = event.touches[0].clientY;
        mobileBlurProgress = Math.min(Math.max(
          mobileBlurProgress + (previousTouchY - currentTouchY) / window.innerHeight,
          0
        ), 1);
        previousTouchY = currentTouchY;
        requestMobileBlurUpdate();
      }, { passive: false });

      window.addEventListener("touchend", () => {
        previousTouchY = undefined;
      }, { passive: true });

      window.addEventListener("wheel", (event) => {
        if (!mobileQuery.matches) return;
        event.preventDefault();
        mobileBlurProgress = Math.min(Math.max(
          mobileBlurProgress + event.deltaY / window.innerHeight,
          0
        ), 1);
        requestMobileBlurUpdate();
      }, { passive: false });

      updateMobileBlur();
    </script>
  </body>
</html>
