<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="UVUV — architecture, landscape, research, activism.">
    <title>UVUV</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        overflow-x: hidden;
      }

      .backgrounds {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      .backgrounds img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: auto;
        min-height: 100vh;
        object-fit: cover;
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
        transform-origin: center;
        animation: cycle 8s linear infinite;
        will-change: transform, opacity;
      }

      .backgrounds img:nth-child(1) { animation-delay: 0s; }
      .backgrounds img:nth-child(2) { animation-delay: 1s; }
      .backgrounds img:nth-child(3) { animation-delay: 2s; }
      .backgrounds img:nth-child(4) { animation-delay: 3s; }
      .backgrounds img:nth-child(5) { animation-delay: 4s; }
      .backgrounds img:nth-child(6) { animation-delay: 5s; }
      .backgrounds img:nth-child(7) { animation-delay: 6s; }
      .backgrounds img:nth-child(8) { animation-delay: 7s; }

      @keyframes cycle {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        12.49% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        12.5%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
      }

      .identity {
        position: relative;
        z-index: 1;
        display: block;
        width: 25vw;
        height: auto;
        margin: 40px 0 0 25vw;
        transition: filter 180ms ease;
      }

      .identity:hover {
        filter: blur(2px);
      }

      @media (prefers-reduced-motion: reduce) {
        .backgrounds img { animation: none; }
        .backgrounds img:first-child { opacity: 1; }
        .identity { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="backgrounds" aria-hidden="true">
      <img src="assets/background-01.webp" alt="" fetchpriority="high">
      <img src="assets/background-02.webp" alt="" loading="eager">
      <img src="assets/background-03.webp" alt="" loading="eager">
      <img src="assets/background-04.webp" alt="" loading="eager">
      <img src="assets/background-05.webp" alt="" loading="eager">
      <img src="assets/background-06.webp" alt="" loading="eager">
      <img src="assets/background-07.webp" alt="" loading="eager">
      <img src="assets/background-08.webp" alt="" loading="eager">
    </div>

    <main>
      <img class="identity" src="assets/uvuv-logo-description.png" alt="UVUV — architecture, landscape, research, activism">
    </main>
  </body>
</html>
